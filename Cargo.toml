[package]
name = "rp-ocr"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rusto-core = "=0.4.1"
rten = { version = "=0.28.0", default-features = false, features = ["rten_format"] }
rten-tensor = "=0.28.0"
rten-model-file = "=0.28.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
lto = false
strip = "symbols"
